      .language { fill: #f8fafc; font-size: 16px; font-weight: 600; }
      .percent { fill: #8eaccd; font-size: 14px; text-anchor: end; }
      .sequence { fill: #38bdf8; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .tiny { fill: #8eaccd; font-size: 12px; letter-spacing: 1px; }
